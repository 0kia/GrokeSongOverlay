<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>okia's Overlay - Link</title>
        <link rel="stylesheet" href="../styles/style.css">
    </head>

    <body>
        <h1>Your Overlay Link</h1>

        <div class="center">
            <p id="status">Logging in...</p>

            <label id="album-art-option" style="display: none;">
                <input type="checkbox" id="show-album-art" checked>
                Show album art
            </label>
            <label id="fade-option" style="display: none;">
                <input type="checkbox" id="enable-fade">
                Fade out
            </label>
            <label id="bg-color-option" style="display: none;">
                <input type="checkbox" id="enable-bg-color">
                Background color
                <input type="color" id="bg-color-picker" value="#121212" disabled>
            </label>
            <label id="width-option" style="display: none;">
                Max Width
                <input type="number" id="text-width" value="450" min="100" max="750" step="10">
            </label>
        </div>

        <script src="../scripts/callback.js"></script>
    </body>
</html>
