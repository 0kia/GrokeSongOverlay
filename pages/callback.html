<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>okia's Overlay - Link</title>
        <link rel="stylesheet" href="../styles/style.css">
    </head>

    <body>
        <h1>Your Overlay Link</h1>

        <div class="center">
            <p id="status">Logging in...</p>

            <label id="album-art-option" style="display: none;">
                <input type="checkbox" id="show-album-art" checked>
                Show album art in overlay
            </label>
            <label id="fade-option" style="display: none;">
                <input type="checkbox" id="enable-fade" checked>
                Fade out when the song has been playing
            </label>
        </div>

        <script src="../scripts/callback.js"></script>
    </body>
</html>
